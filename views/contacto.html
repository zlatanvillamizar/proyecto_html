    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

</head>

    <header>
        <div class="logo">ECO-MARKET</div>
        <nav>
            <a href="../index.html">INICIO</a>

            <a href="sobre-nosotros.html">NOSOTROS</a>
            <a href="contacto.html">CONTACTO</a>
        </nav>
    </header>

    <main class="contacto-page container">
        <h1>Contacto</h1>
        <p>Estamos aquí para ayudarte. Déjanos tu mensaje y te responderemos pronto.</p>

        <form class="contacto-form form-container">
            <input type="text" placeholder="Tu nombre" class="input-field" required>
            <input type="email" placeholder="Tu correo electrónico" class="input-field" required>
            <textarea placeholder="¿En qué podemos ayudarte?" rows="5" class="input-field" required></textarea>
            <button type="submit" class="btn-ver">Enviar mensaje</button>
        </form>
    </main>

    <footer>
        <div class="container" style="text-align: center; padding: 2rem 0;">
